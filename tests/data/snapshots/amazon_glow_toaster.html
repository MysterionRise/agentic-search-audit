<!-- amazon.com homepage, 2026-11-03: the delivery-location toaster shown to visitors
     outside the US, over a results grid. The script stands in for Amazon's handler. -->
<html><body>
<div class="s-main-slot" style="margin-top:220px">
  <div class="s-result-item"><div class="s-product-image-container s-image-overlay-grey"
       style="position:relative;width:260px;height:230px"></div><h2>Laptop stand</h2></div>
</div>
<div data-toaster-blocking="0" data-toaster-csrftoken="x" data-toaster-slot="DEFAULT" data-toaster-type="AIS_INGRESS" aria-describedby="glow-toaster-body" aria-labelledby="glow-toaster-title" class="a-section glow-toaster glow-toaster-theme-default glow-toaster-slot-default nav-coreFlyout nav-flyout" role="alertdialog" style="position:absolute;top:69px;left:121px;width:450px;min-height:118px;background:#fff;z-index:100">
    <div class="glow-toaster-content">

            <div class="nav-arrow">
                <div class="nav-arrow-inner"></div>
            </div>

        <h5 id="glow-toaster-title" class="glow-toaster-title aok-hidden">
            International Shopping Transition Alert
        </h5>





<div id="glow-toaster-body" class="a-section a-spacing-none glow-toaster-body">
    <span class="a-size-base">
        <div style="color: black">
            <div class="a-box a-alert a-alert-error glow-toaster-error aok-hidden a-spacing-base" role="alert"><div class="a-box-inner a-alert-container"><i class="a-icon a-icon-alert" aria-hidden="true"></i><div class="a-alert-content"></div></div></div>
        </div>




                We're showing you items that ship to <strong> United Kingdom</strong>. To see items that ship to a different country, change your delivery address.


    </span>
</div>


            <div class="glow-toaster-footer">




                    <span class="a-button a-spacing-top-base a-button-base glow-toaster-button glow-toaster-button-dismiss" id="a-autoid-1"><span class="a-button-inner"><input data-action-params="{&quot;toasterType&quot;:&quot;AIS_INGRESS&quot;}" data-action-type="DISMISS" class="a-button-input" type="submit" aria-labelledby="a-autoid-1-announce"><span class="a-button-text" aria-hidden="true" id="a-autoid-1-announce">
                        Dismiss
                    </span></span></span>





                    <span class="a-button a-spacing-top-base a-button-primary glow-toaster-button glow-toaster-button-submit" id="a-autoid-2"><span class="a-button-inner"><input data-action-type="SELECT_LOCATION" class="a-button-input" type="submit" aria-labelledby="a-autoid-2-announce"><span class="a-button-text" aria-hidden="true" id="a-autoid-2-announce">
                        Change Address
                    </span></span></span>

            </div>

    </div>
</div>
<script>
document.addEventListener('click', function(e) {
  if (e.target.closest('[data-action-type="DISMISS"]')) {
    document.querySelector('.glow-toaster').remove();
  }
});
</script>
</body></html>
