[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-search-audit"
version = "0.1.0"
description = "Open-source agentic search quality evaluator using browser automation and LLM-as-a-judge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Agentic Search Audit Contributors"}
]
keywords = ["search", "audit", "llm", "mcp", "browser-automation", "quality-evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",                   # robots.txt fetching and the --auto-generate homepage fetch
    "openai>=1.0",                    # judge and vision providers; also OpenRouter and vLLM endpoints
    "anthropic>=0.18",
    "mcp>=1.26,<2",                   # 2.x renames CallToolResult.isError -> is_error and raises from call_tool
    "playwright>=1.40",
    "playwright-stealth>=2.0.3,<3",   # 2.x API: Stealth().apply_stealth_async(); see browser/stealth.py
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    # Formatter, linter and type checker are pinned exactly. pre-commit, the Makefile
    # and CI all run them through `uv run`, so this is the single place to bump them.
    "black==26.10.1",
    "ruff==0.17.2",
    "mypy==1.19.1",
    "types-pyyaml>=6.0",
    "pre-commit>=4.2",
    "build>=1.2",
]
saas = [  # experimental REST API, worker and database layer (see docs/SAAS.md)
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.6",
    "prometheus-client>=0.19",
    "sentry-sdk[fastapi]>=1.39",
    "stripe>=10.0",
    "httpx>=0.28",                    # fastapi.testclient and tests/api
]
pdf = [
    "weasyprint>=60.0",
]
undetected = [
    "undetected-chromedriver>=3.5.0",
    "selenium>=4.15.0",
    # undetected-chromedriver 3.5.x imports distutils, which Python 3.12 removed;
    # setuptools provides the compatibility shim.
    "setuptools>=68; python_version >= '3.12'",
]
browserbase = [
    "browserbase>=0.3.0",
]
all-browsers = [
    "agentic-search-audit[undetected,browserbase]",
]

[project.scripts]
search-audit = "agentic_search_audit.cli.main:main"
search-audit-api = "agentic_search_audit.api.server:main"
search-audit-worker = "agentic_search_audit.jobs.worker:run_worker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (opt-in; need a real browser or external service)",
    "browser: Tests that launch Playwright's Chromium (skipped when it is not installed)",
    "slow: Slow tests that may take a while",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["agentic_search_audit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
