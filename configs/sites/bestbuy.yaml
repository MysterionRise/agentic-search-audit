# BestBuy.com specific configuration

site:
  # intl=nosplash skips the country selector shown to visitors from outside the US.
  url: "https://www.bestbuy.com/?intl=nosplash"
  locale: "en-US"

  search:
    input_selectors:
      - '#gh-search-input'
      - 'input[class*="search-input"]'
      - 'input[type="search"]'
      - 'input[aria-label*="Search" i]'
      - 'input[placeholder*="Search" i]'
    submit_strategy: "enter"
    submit_selector: null
    search_url_template: "https://www.bestbuy.com/site/searchpage.jsp?st={query}&intl=nosplash"
    use_intelligent_fallback: true

  results:
    # Best Buy's list items (checked 2026-11-04). The price selectors are unverified: that
    # search returned only pre-orders, which show no price.
    item_selectors:
      - 'li[class*="product-list-item"]'
      - 'li[class*="sku-item"]'
    title_selectors:
      - 'h3.product-title'
      - '.sku-title'
    url_attr: 'href'
    snippet_selectors: []
    price_selectors:
      - '[data-testid="customer-price"] span'
      - '.priceView-customer-price span'
      - '[class*="customer-price"]'
    image_selectors:
      - 'img[data-testid="product-image"]'
      - 'img'

  modals:
    close_text_matches:
      - "accept"
      - "agree"
      - "close"
      - "dismiss"
      - "no thanks"
      - "got it"
      - "not now"
    max_auto_clicks: 3
    wait_after_close_ms: 500

run:
  top_k: 10
  viewport_width: 1366
  viewport_height: 900
  network_idle_ms: 3000
  post_submit_ms: 2000
  headless: true
  throttle_rps: 0.5
  seed: 42
  # Best Buy uses bot detection; undetected-chromedriver recommended.
  browser_backend: undetected

llm:
  provider: "openrouter"
  model: "openai/gpt-4o"
  max_tokens: 2000
  temperature: 0.2
  system_prompt: null
  base_url: "https://openrouter.ai/api/v1"
  api_key: null  # Set in .env as OPENROUTER_API_KEY

report:
  formats:
    - "md"
    - "html"
  out_dir: "./runs"
