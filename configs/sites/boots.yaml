# Boots.com specific configuration (UK pharmacy/beauty retailer)

site:
  url: "https://www.boots.com"
  locale: "en-GB"

  search:
    input_selectors:
      - 'input[name="search"]'
      - 'input[type="search"]'
      - 'input[aria-label*="Search" i]'
      - 'input[placeholder*="Search" i]'
    submit_strategy: "enter"
    submit_selector: null
    search_url_template: "https://www.boots.com/SearchDisplay?searchType=1002&storeId=11352&pageView=grid&sType=SimpleSearch&catalogId=28501&searchTerm={query}&resultCatEntryType=2&showResultsPage=true&beginIndex=0&langId=-1"
    use_intelligent_fallback: true

  results:
    # Boots' "oct-teaser" product tiles (checked 2026-11-04). Searches for a category word
    # redirect to the category page, which uses the same tiles. Cards have no description.
    item_selectors:
      - '.oct-teaser-wrapper'
      - '.oct-teaser--theme-productTile'
      - '[data-testid="product-card"]'
    title_selectors:
      - '.oct-teaser__title'
      - '[data-testid="product-title"]'
      - 'h3'
    url_attr: 'href'
    snippet_selectors: []
    price_selectors:
      - '.oct-teaser__price-col1-wrapper p'
      - '.oct-teaser__price-wrapper--current'
      - '[data-testid="product-price"]'
    image_selectors:
      - 'img.oct-image--lazy'
      - 'img'

  modals:
    close_text_matches:
      - "accept"
      - "accept all"
      - "agree"
      - "got it"
      - "close"
      - "dismiss"
      - "no thanks"
      - "reject all"
      - "reject"
    max_auto_clicks: 3
    wait_after_close_ms: 500

run:
  top_k: 10
  viewport_width: 1366
  viewport_height: 900
  network_idle_ms: 3000
  post_submit_ms: 2000
  headless: true
  throttle_rps: 0.5
  seed: 42
  # Imperva blocks launched browsers here (2026-11-03). Run it in your own Chrome instead:
  # --browser kimi_webbridge or --browser chrome_devtools_mcp (docs/BROWSER_BACKENDS.md run 2).
  browser_backend: undetected

llm:
  provider: "openrouter"
  model: "openai/gpt-4o"
  max_tokens: 2000
  temperature: 0.2
  system_prompt: null
  base_url: "https://openrouter.ai/api/v1"
  api_key: null

report:
  formats:
    - "md"
    - "html"
  out_dir: "./runs"
