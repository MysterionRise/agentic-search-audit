# Currys.co.uk specific configuration (UK electronics retailer)

site:
  url: "https://www.currys.co.uk"
  locale: "en-GB"

  search:
    input_selectors:
      - 'input[name="search"]'
      - 'input[type="search"]'
      - 'input[aria-label*="Search" i]'
      - 'input[placeholder*="Search" i]'
    submit_strategy: "enter"
    submit_selector: null
    search_url_template: "https://www.currys.co.uk/search?q={query}"
    use_intelligent_fallback: true

  results:
    # Currys product tiles (checked 2026-11-04); category words redirect to a category page
    # with the same tiles.
    item_selectors:
      - 'div.product[data-pid]'
      - '.product-item-element'
    title_selectors:
      - 'h2.pdp-grid-product-name'
    url_attr: 'href'
    snippet_selectors:
      - '.curry-sansreg-font'
    price_selectors:
      - '.price-link .value'
    image_selectors:
      - 'img.tile-image'
      - 'img'

  modals:
    close_text_matches:
      - "accept"
      - "accept all"
      - "agree"
      - "got it"
      - "close"
      - "dismiss"
      - "no thanks"
      - "reject"
    max_auto_clicks: 3
    wait_after_close_ms: 500

run:
  top_k: 10
  viewport_width: 1366
  viewport_height: 900
  network_idle_ms: 3000
  post_submit_ms: 2000
  headless: true
  throttle_rps: 0.5
  seed: 42
  browser_backend: undetected

llm:
  provider: "openrouter"
  model: "openai/gpt-4o"
  max_tokens: 2000
  temperature: 0.2
  system_prompt: null
  base_url: "https://openrouter.ai/api/v1"
  api_key: null

report:
  formats:
    - "md"
    - "html"
  out_dir: "./runs"
