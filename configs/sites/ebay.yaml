# eBay.com specific configuration

site:
  url: "https://www.ebay.com"
  locale: "en-US"

  search:
    input_selectors:
      - '#gh-ac-box2 input'
      - '#gh-ac'
      - 'input[type="text"][aria-label*="Search" i]'
      - 'input[placeholder*="Search" i]'
      - 'input[name="_nkw"]'
    submit_strategy: "enter"
    submit_selector: null
    search_url_template: "https://www.ebay.com/sch/i.html?_nkw={query}"
    use_intelligent_fallback: true

  results:
    # eBay's card layout (checked 2026-11-04). Two hidden "Shop on eBay" placeholders sit
    # in a 1px-wide div.s-clipped before the list, so match listings that are children of
    # the results list. The .s-item selectors cover the older layout.
    item_selectors:
      - 'ul.srp-results > li[data-listingid]'
      - 'li.s-card[data-item-pos]'
      - '.srp-results .s-item'
      - '.s-item'
    title_selectors:
      - '.s-card__title .su-styled-text'
      - '.s-card__title'
      - '.s-item__title span'
      - '.s-item__title'
    url_attr: 'href'
    snippet_selectors:
      - '.s-card__subtitle'
      - '.s-item__subtitle'
    price_selectors:
      - '.s-card__price'
      - '.s-item__price'
    image_selectors:
      - 'img.s-card__image'
      - '.s-item__image img'
      - 'img'

  modals:
    close_text_matches:
      - "accept"
      - "agree"
      - "close"
      - "dismiss"
      - "no thanks"
      - "got it"
      - "not now"
    max_auto_clicks: 3
    wait_after_close_ms: 500

run:
  top_k: 10
  viewport_width: 1366
  viewport_height: 900
  network_idle_ms: 3000
  post_submit_ms: 2000
  headless: true
  throttle_rps: 0.5
  seed: 42
  # eBay serves its edge block page to launched browsers, undetected-chromedriver included
  # (2026-11-03). Run it in your own Chrome instead: --browser kimi_webbridge or
  # --browser chrome_devtools_mcp (both pass, docs/BROWSER_BACKENDS.md run 2).
  browser_backend: undetected
  # browser_backend: chrome_devtools_mcp
  # bridge:
  #   mode: autoconnect

llm:
  provider: "openrouter"
  model: "openai/gpt-4o"
  max_tokens: 2000
  temperature: 0.2
  system_prompt: null
  base_url: "https://openrouter.ai/api/v1"
  api_key: null  # Set in .env as OPENROUTER_API_KEY

report:
  formats:
    - "md"
    - "html"
  out_dir: "./runs"
