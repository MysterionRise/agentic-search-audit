# Old Navy (oldnavy.gap.com) specific configuration

site:
  url: "https://oldnavy.gap.com"
  locale: "en-US"

  search:
    input_selectors:
      - 'input[type="search"]'
      - 'input[aria-label*="Search" i]'
      - 'input[placeholder*="Search" i]'
      - 'input[name="searchText"]'
    submit_strategy: "enter"
    submit_selector: null
    search_url_template: "https://oldnavy.gap.com/browse/search.do?searchText={query}"
    use_intelligent_fallback: true

  results:
    # Old Navy's product cards (checked 2026-11-04).
    item_selectors:
      - '.plp_product-card'
      - '.product-card'
    title_selectors:
      - '[data-testid="plp_product-name"]'
    url_attr: 'href'
    snippet_selectors: []
    price_selectors:
      - 'span[aria-label^="Current price"]'
      - '[class*="core-web-price-small"]'
    image_selectors:
      - 'img'

  modals:
    close_text_matches:
      - "accept"
      - "agree"
      - "close"
      - "dismiss"
      - "no thanks"
      - "got it"
      - "not now"
      - "maybe later"
    max_auto_clicks: 3
    wait_after_close_ms: 500

run:
  top_k: 10
  viewport_width: 1366
  viewport_height: 900
  network_idle_ms: 3000
  post_submit_ms: 2000
  headless: true
  throttle_rps: 0.5
  seed: 42
  # Old Navy has lenient bot detection; playwright is sufficient.
  browser_backend: playwright

llm:
  provider: "openrouter"
  model: "openai/gpt-4o"
  max_tokens: 2000
  temperature: 0.2
  system_prompt: null
  base_url: "https://openrouter.ai/api/v1"
  api_key: null  # Set in .env as OPENROUTER_API_KEY

report:
  formats:
    - "md"
    - "html"
  out_dir: "./runs"
