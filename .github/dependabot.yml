version: 2
updates:
  - package-ecosystem: "uv"            # reads pyproject.toml + uv.lock
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # majors (for example mcp 2.x, playwright-stealth 3.x) stay as individual PRs
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pre-commit"    # bumps rev: for pre-commit/pre-commit-hooks
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
