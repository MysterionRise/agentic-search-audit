name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:   # every PR, including ones stacked on a feature branch

env:
  UV_LOCKED: "1"   # uv sync/run fail if uv.lock does not match pyproject.toml

jobs:
  lint:
    name: Lint and Format Check   # job names are referenced by branch protection; keep them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (dev + saas so mypy sees the API and DB layer)
        run: uv sync --extra dev --extra saas
      - name: Black
        run: uv run black --check src/ tests/
      - name: Ruff
        run: uv run ruff check src/ tests/
      - name: mypy
        run: uv run mypy src/

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra saas
      - name: Tests
        run: uv run pytest tests/ -m "not browser and not integration" --cov --cov-report=term-missing

  test-package:
    name: Test Package Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Install the wheel into a clean venv (no extras)
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
      - name: CLI works
        run: |
          /tmp/wheel-venv/bin/search-audit --help
          /tmp/wheel-venv/bin/python -c "import agentic_search_audit; print(agentic_search_audit.__version__)"

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: Export the locked dependency set (all extras)
        run: uv export --format requirements-txt --all-extras --no-emit-project --no-hashes -o requirements-audit.txt
      - name: pip-audit (isolated via uvx, so the scanner's own deps are not scanned)
        run: uvx --python 3.12 pip-audit --no-deps --strict --desc on -r requirements-audit.txt
      - name: Bandit (medium severity and above)
        run: uvx --python 3.12 bandit -r src/ -ll
