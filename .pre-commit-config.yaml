repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^uv\.lock$   # lock files are legitimately large
      - id: check-json
      - id: check-toml
      - id: detect-private-key

  # Python tools run from the project venv, so pre-commit, the Makefile and CI all use
  # the versions pinned in pyproject.toml (dev extra) and uv.lock.
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --no-sync black
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (src/)
        entry: uv run --no-sync mypy src/
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
